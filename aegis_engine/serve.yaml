modeling_v2: require
disable_mm_encoder: true
generation_config: trtllm
enable_chunked_prefill: false
enable_autotuner: false
max_batch_size: 128
max_num_tokens: 8192
max_seq_len: 8192
num_serve_frontends: 1
speculative_config:
  decoding_type: MTP
  max_draft_len: 4
  draft_len_schedule: {4: 4, 32: 3, 128: 1}
cuda_graph_config:
  batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128]
  enable_padding: true
kv_cache_config:
  free_gpu_memory_fraction: 0.75
  enable_block_reuse: false
  mamba_ssm_cache_dtype: float32
